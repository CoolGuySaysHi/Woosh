<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Woosh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- TAB BAR -->
  <div id="tab-bar">
    <div id="drag-region-tabs"></div>
    <div id="tabs-container"></div>
    <button id="btn-new-tab" title="New Tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
    <div id="window-controls">
      <button class="wc-btn" id="btn-minimize">
        <svg viewBox="0 0 12 12"><rect x="1" y="5.5" width="10" height="1" fill="currentColor" rx="0.5"/></svg>
      </button>
      <button class="wc-btn" id="btn-maximize">
        <svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.2" rx="1"/></svg>
      </button>
      <button class="wc-btn" id="btn-close">
        <svg viewBox="0 0 12 12">
          <line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- TOOLBAR -->
  <div id="toolbar">
    <div id="nav-buttons">
      <button class="nav-btn" id="btn-back" title="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="nav-btn" id="btn-forward" title="Forward">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button class="nav-btn" id="btn-reload" title="Reload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
      <button class="nav-btn" id="btn-home" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </button>
    </div>

    <div id="addressbar-wrap">
      <div id="lock-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <input type="text" id="addressbar" placeholder="Search Woosh or enter a URL..." spellcheck="false" autocomplete="off"/>
      <button id="pwa-install-btn" class="hidden" title="Install app">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
      <div id="loading-spinner" class="hidden"><div class="spinner"></div></div>
    </div>

    <!-- Bookmark star button -->
    <div id="toolbar-right">
    <button class="nav-btn" id="btn-bookmark" title="Bookmark this page">
      <svg id="bookmark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    </button>

    <!-- Privacy shield button -->
    <button class="nav-btn" id="btn-shield" title="Privacy protection">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span id="shield-count"></span>
    </button>

    <!-- Password manager button -->
    <button class="nav-btn" id="btn-passwords" title="Saved passwords">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        <circle cx="12" cy="16" r="1" fill="currentColor"/>
      </svg>
    </button>

    <!-- Profile / Sync button -->
    <button class="nav-btn" id="btn-profile" title="Account & Sync">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span id="profile-sync-dot"></span>
    </button>
    </div><!-- end toolbar-right -->

  </div><!-- end toolbar -->
  <div id="password-popup" class="hidden">
    <div id="password-popup-header">
      <span id="password-popup-title">🔑 Passwords</span>
      <button id="password-popup-close">✕</button>
    </div>
    <div id="password-popup-body">
      <div id="password-search-wrap">
        <input type="text" id="password-search" placeholder="Search passwords..." autocomplete="off"/>
      </div>
      <div id="password-list"></div>
      <div id="password-empty">No saved passwords yet.<br/>Woosh will offer to save them when you log in.</div>
    </div>
  </div>

  <!-- BOOKMARKS BAR -->
  <div id="bookmarks-bar">
    <div id="bookmarks-list"></div>
    <div id="bookmarks-empty">Click ★ to bookmark the current page</div>
  </div>

  <!-- RIGHT-CLICK CONTEXT MENU for bookmarks -->
  <div id="bookmark-context-menu">
    <button id="ctx-remove">🗑 Remove bookmark</button>
  </div>

  <!-- SHIELD / AD BLOCKER POPUP -->
  <div id="shield-popup" class="hidden">
    <div id="shield-popup-header">
      <span>🛡 Protection</span>
      <button id="shield-popup-close">✕</button>
    </div>
    <div id="shield-toggle-row">
      <span>Ad & Tracker Blocker</span>
      <button id="shield-toggle-btn" class="toggle-btn">ON</button>
    </div>
    <div id="shield-site-row">
      <span id="shield-site-name">This site</span>
      <button id="shield-whitelist-btn" class="toggle-btn">Allow ads</button>
    </div>
    <div id="shield-whitelist-section">
      <div class="shield-section-title">Whitelisted sites</div>
      <div id="shield-whitelist-list"></div>
    </div>
    <button id="shield-stats-btn">View privacy stats →</button>
  </div>

  <!-- SAVE PASSWORD BANNER -->
  <div id="save-password-banner" class="hidden"></div>

  <!-- DOWNLOAD BAR -->
  <div id="download-bar" class="hidden">
    <div id="download-bar-items"></div>
    <button id="download-bar-close">✕</button>
  </div>

  <!-- PERMISSION DIALOG -->
  <div id="permission-dialog" class="hidden">
    <div id="permission-icon"></div>
    <div id="permission-text"></div>
    <div id="permission-buttons">
      <button id="permission-allow">Allow</button>
      <button id="permission-deny">Deny</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
