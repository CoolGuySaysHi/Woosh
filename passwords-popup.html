<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Passwords</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --accent: #8b6cf7;
      --pink: #f06292;
      --green: #4caf50;
      --bg: #13111e;
      --border: rgba(255,255,255,0.08);
      --text: #e8e0ff;
      --muted: rgba(232,224,255,0.45);
      --font: 'Fredoka', sans-serif;
      --mono: 'DM Mono', monospace;
    }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font);
      height: 100vh; display: flex; flex-direction: column;
      border: 1px solid rgba(139,108,247,0.35); border-radius: 12px;
      overflow: hidden; user-select: none;
    }
    /* Header with tabs */
    #header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; border-bottom: 1px solid var(--border);
      flex-shrink: 0; -webkit-app-region: drag;
    }
    #title { font-size: 14px; font-weight: 600; }
    #close-btn {
      -webkit-app-region: no-drag; background: transparent; border: none;
      color: var(--muted); cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 4px;
    }
    #close-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }

    /* Tab switcher */
    #tabs {
      display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .tab-btn {
      flex: 1; padding: 8px; background: transparent; border: none;
      color: var(--muted); font-family: var(--font); font-size: 13px; cursor: pointer;
      border-bottom: 2px solid transparent; transition: all 0.15s;
    }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab-btn:hover { color: var(--text); }

    /* Panels */
    .panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .panel.active { display: flex; }

    /* Saved passwords panel */
    #search-wrap { padding: 8px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    #search {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 10px; color: var(--text);
      font-family: var(--font); font-size: 13px; outline: none;
    }
    #search:focus { border-color: var(--accent); }
    #list { flex: 1; overflow-y: auto; padding: 6px; }
    #list::-webkit-scrollbar { width: 4px; }
    #list::-webkit-scrollbar-thumb { background: rgba(139,108,247,0.3); border-radius: 2px; }
    #empty { text-align: center; padding: 30px 16px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px; transition: background 0.1s;
    }
    .item:hover { background: rgba(255,255,255,0.05); }
    .fav {
      width: 28px; height: 28px; border-radius: 6px;
      background: linear-gradient(135deg, var(--accent), var(--pink));
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: white; flex-shrink: 0; overflow: hidden;
    }
    .fav img { width: 100%; height: 100%; object-fit: cover; }
    .info { flex: 1; min-width: 0; }
    .domain { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .username { font-size: 11px; color: var(--muted); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btns { display: flex; gap: 4px; flex-shrink: 0; }
    .btn {
      background: transparent; border: 1px solid var(--border); border-radius: 6px;
      color: var(--muted); font-size: 11px; padding: 4px 7px; cursor: pointer;
      transition: all 0.1s; font-family: var(--mono);
    }
    .btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    .btn.del:hover { border-color: rgba(245,93,93,0.4); color: #f55d5d; }

    /* Manual save panel */
    #manual-panel { padding: 14px; gap: 10px; }
    #manual-panel .section-title {
      font-size: 11px; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.06em; margin-bottom: 2px;
    }
    #manual-panel input {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; color: var(--text);
      font-family: var(--mono); font-size: 13px; outline: none; margin-bottom: 8px;
    }
    #manual-panel input:focus { border-color: var(--accent); }
    #manual-panel input::placeholder { color: var(--muted); }
    .save-btn {
      width: 100%; background: linear-gradient(135deg, var(--accent), var(--pink));
      border: none; border-radius: 8px; color: white;
      font-family: var(--font); font-size: 14px; font-weight: 600;
      padding: 9px; cursor: pointer; transition: opacity 0.15s;
    }
    .save-btn:hover { opacity: 0.85; }
    #saved-msg { text-align: center; color: var(--green); font-size: 13px; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <div id="header">
    <span id="title">🔑 Passwords</span>
    <button id="close-btn">✕</button>
  </div>

  <div id="tabs">
    <button class="tab-btn active" data-tab="saved">Saved</button>
    <button class="tab-btn" data-tab="manual">Save manually</button>
  </div>

  <!-- Saved passwords tab -->
  <div class="panel active" id="saved-panel">
    <div id="search-wrap">
      <input type="text" id="search" placeholder="Search passwords..." autocomplete="off"/>
    </div>
    <div id="list"></div>
    <div id="empty">No saved passwords yet.<br/>Woosh will offer to save when you log in.</div>
  </div>

  <!-- Manual save tab -->
  <div class="panel" id="manual-panel">
    <div class="section-title">Site</div>
    <input type="text" id="manual-site" placeholder="e.g. github.com" autocomplete="off"/>
    <div class="section-title">Username or email</div>
    <input type="text" id="manual-user" placeholder="you@example.com" autocomplete="off"/>
    <div class="section-title">Password</div>
    <input type="password" id="manual-pass" placeholder="••••••••" autocomplete="new-password"/>
    <button class="save-btn" id="manual-save-btn">Save password</button>
    <div id="saved-msg">✓ Password saved!</div>
  </div>

  <script>
    const ipc = window.ipc;
    let all = [];

    // ── Tab switching ──────────────────────────────────────────
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab + '-panel').classList.add('active');
      });
    });

    document.getElementById('close-btn').addEventListener('click', () => ipc.send('close-password-popup'));

    // ── Saved passwords tab ────────────────────────────────────
    async function load() {
      all = await ipc.invoke('get-passwords');
      render(all);
    }

    function render(passwords) {
      const list  = document.getElementById('list');
      const empty = document.getElementById('empty');
      list.innerHTML = '';
      empty.style.display = passwords.length ? 'none' : 'block';
      passwords.forEach(p => {
        const item = document.createElement('div');
        item.className = 'item';
        const fav = document.createElement('div');
        fav.className = 'fav';
        fav.textContent = p.domain[0].toUpperCase();
        const img = new Image();
        img.onload = () => { fav.innerHTML = ''; fav.appendChild(img); img.style.cssText = 'width:100%;height:100%;object-fit:cover'; };
        img.src = 'https://' + p.domain + '/favicon.ico';
        const info = document.createElement('div');
        info.className = 'info';
        info.innerHTML = `<div class="domain">${p.domain}</div><div class="username">${p.username}</div>`;
        const btns = document.createElement('div');
        btns.className = 'btns';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'btn'; copyBtn.textContent = '📋'; copyBtn.title = 'Copy password';
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(p.password);
          copyBtn.textContent = '✓';
          setTimeout(() => copyBtn.textContent = '📋', 1500);
        });
        const fillBtn = document.createElement('button');
        fillBtn.className = 'btn'; fillBtn.textContent = 'Fill'; fillBtn.title = 'Autofill';
        fillBtn.addEventListener('click', () => {
          ipc.send('autofill-password', { username: p.username, password: p.password });
          ipc.send('close-password-popup');
        });
        const delBtn = document.createElement('button');
        delBtn.className = 'btn del'; delBtn.textContent = '🗑'; delBtn.title = 'Delete';
        delBtn.addEventListener('click', async () => {
          await ipc.invoke('delete-password', { domain: p.domain, username: p.username });
          load();
        });
        btns.appendChild(copyBtn); btns.appendChild(fillBtn); btns.appendChild(delBtn);
        item.appendChild(fav); item.appendChild(info); item.appendChild(btns);
        list.appendChild(item);
      });
    }

    document.getElementById('search').addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      render(q ? all.filter(p => p.domain.includes(q) || p.username.includes(q)) : all);
    });

    // ── Manual save tab ────────────────────────────────────────
    // Pre-fill current site
    ipc.invoke('get-current-domain').then(domain => {
      if (domain) document.getElementById('manual-site').value = domain;
    }).catch(() => {});

    document.getElementById('manual-save-btn').addEventListener('click', async () => {
      const site = document.getElementById('manual-site').value.trim()
        .replace(/^https?:\/\//, '').replace(/\/.*/, '').replace(/^www\./, '');
      const user = document.getElementById('manual-user').value.trim();
      const pass = document.getElementById('manual-pass').value;
      if (!site || !user || !pass) {
        document.getElementById('manual-site').style.borderColor = site ? '' : 'rgba(245,93,93,0.6)';
        document.getElementById('manual-user').style.borderColor = user ? '' : 'rgba(245,93,93,0.6)';
        document.getElementById('manual-pass').style.borderColor = pass ? '' : 'rgba(245,93,93,0.6)';
        return;
      }
      await ipc.invoke('save-password', { domain: site, username: user, password: pass });
      document.getElementById('saved-msg').style.display = 'block';
      document.getElementById('manual-pass').value = '';
      document.getElementById('manual-user').value = '';
      document.getElementById('manual-site').value = '';
      setTimeout(() => { document.getElementById('saved-msg').style.display = 'none'; }, 2500);
      // Switch to saved tab to show result
      setTimeout(() => {
        document.querySelectorAll('.tab-btn')[0].click();
        load();
      }, 1000);
    });

    // Also remove the manual save from shield popup
    load();
  </script>
</body>
</html>
