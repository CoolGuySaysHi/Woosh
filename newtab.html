<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Woosh Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #8b6cf7;
      --pink:   #f06bbd;
      --cyan:   #5dd8f5;
      --green:  #5df5a8;
      --yellow: #f5d75d;
      --bg:     #0a0a0f;
      --card:   #111118;
      --border: rgba(255,255,255,0.07);
      --text:   #eeeaf8;
      --muted:  #5a566e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Fredoka', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }
    .blob-1 { width: 400px; height: 400px; background: var(--purple); top: -100px; left: -100px; animation-delay: 0s; }
    .blob-2 { width: 300px; height: 300px; background: var(--pink);   bottom: -80px; right: -80px; animation-delay: -3s; }
    .blob-3 { width: 250px; height: 250px; background: var(--cyan);   top: 40%; left: 60%; animation-delay: -5s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%       { transform: translate(20px, -20px) scale(1.05); }
      66%       { transform: translate(-15px, 15px) scale(0.95); }
    }

    .main {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: 100%;
      max-width: 640px;
      padding: 0 20px;
    }

    .clock {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.05em;
      animation: popIn 0.4s both;
    }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      animation: popIn 0.5s 0.05s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .logo {
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
      background: linear-gradient(135deg, var(--purple) 0%, var(--pink) 40%, var(--cyan) 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(139,108,247,0.4));
      cursor: pointer;
    }

    .tagline {
      font-size: 15px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .search-wrap {
      width: 100%;
      animation: slideUp 0.5s 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 50px;
      padding: 6px 6px 6px 22px;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .search-box:focus-within {
      border-color: rgba(139, 108, 247, 0.6);
      box-shadow: 0 0 0 4px rgba(139,108,247,0.12), 0 0 30px rgba(139,108,247,0.2);
    }

    .search-icon { color: var(--muted); display: flex; align-items: center; flex-shrink: 0; }
    .search-icon svg { width: 18px; height: 18px; }

    #search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Fredoka', sans-serif;
      font-size: 18px;
      font-weight: 500;
      caret-color: var(--purple);
    }
    #search-input::placeholder { color: var(--muted); }

    .search-btn {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border: none;
      border-radius: 40px;
      padding: 10px 22px;
      color: white;
      font-family: 'Fredoka', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .search-btn:hover { transform: scale(1.04); box-shadow: 0 4px 20px rgba(139,108,247,0.4); }
    .search-btn:active { transform: scale(0.97); }

    .quick-search {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      animation: slideUp 0.5s 0.2s both;
    }

    .quick-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 6px 14px;
      color: var(--muted);
      font-family: 'Fredoka', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .quick-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); transform: translateY(-1px); }

    .shortcuts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      animation: slideUp 0.5s 0.3s both;
    }

    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      color: var(--text);
    }
    .shortcut:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.12); }

    .shortcut-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .shortcut-label { font-size: 13px; font-weight: 500; color: var(--muted); }

    /* Privacy widget */
    .privacy-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(93,245,168,0.06);
      border: 1px solid rgba(93,245,168,0.15);
      border-radius: 50px;
      padding: 8px 20px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      animation: slideUp 0.5s 0.4s both;
    }
    .privacy-bar:hover { background: rgba(93,245,168,0.1); border-color: rgba(93,245,168,0.3); transform: translateY(-1px); }
    .privacy-shield { font-size: 15px; }
    .privacy-text { font-size: 13px; color: #5df5a8; font-family: 'DM Mono', monospace; font-weight: 500; }
    .privacy-text span { color: white; font-weight: 700; }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="main">
    <div class="clock" id="clock"></div>

    <div class="logo-wrap">
      <div class="logo" id="logo">Woosh</div>
      <div class="tagline">your browser, your rules ✦</div>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <div class="search-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
        <input type="text" id="search-input" placeholder="Search Woosh or enter a URL..." autocomplete="off" spellcheck="false"/>
        <button class="search-btn" id="search-btn">Woosh! 🚀</button>
      </div>
    </div>

    <div class="quick-search">
      <button class="quick-btn" data-query="latest news">📰 News</button>
      <button class="quick-btn" data-query="youtube">📺 YouTube</button>
      <button class="quick-btn" data-query="wikipedia">📖 Wikipedia</button>
      <button class="quick-btn" data-query="cool facts">✨ Cool Facts</button>
      <button class="quick-btn" data-query="minecraft wiki">⛏️ Minecraft</button>
      <button class="quick-btn" data-query="how to code python">🐍 Python</button>
    </div>

    <div class="shortcuts">
      <a class="shortcut" href="#" data-url="https://www.youtube.com">
        <div class="shortcut-icon" style="background:rgba(255,80,80,0.15);color:#ff5050">▶</div>
        <span class="shortcut-label">YouTube</span>
      </a>
      <a class="shortcut" href="#" data-url="https://www.wikipedia.org">
        <div class="shortcut-icon" style="background:rgba(255,255,255,0.08);color:#ccc">W</div>
        <span class="shortcut-label">Wikipedia</span>
      </a>
      <a class="shortcut" href="#" data-url="https://scratch.mit.edu">
        <div class="shortcut-icon" style="background:rgba(255,170,50,0.15);color:#ffaa32">🐱</div>
        <span class="shortcut-label">Scratch</span>
      </a>
      <a class="shortcut" href="#" data-url="https://github.com">
        <div class="shortcut-icon" style="background:rgba(255,255,255,0.06);color:#aaa">⬡</div>
        <span class="shortcut-label">GitHub</span>
      </a>
    </div>

    <!-- Privacy stats bar -->
    <a class="privacy-bar" href="#" id="privacy-link">
      <span class="privacy-shield">🛡️</span>
      <span class="privacy-text"><span id="privacy-count">0</span> ads &amp; trackers blocked</span>
    </a>

  </div>

  <script>
    // Clock
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      document.getElementById('clock').textContent =
        `${h}:${m} · ${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
    }
    updateClock();
    setInterval(updateClock, 10000);

    // Search — navigate via address bar IPC so main.js routes it correctly
    function doSearch(query) {
      if (!query.trim()) return;
      // If it looks like a URL, navigate directly
      if (query.startsWith('http://') || query.startsWith('https://') ||
          (query.includes('.') && !query.includes(' '))) {
        window.location.href = query.startsWith('http') ? query : 'https://' + query;
      } else {
        // Route to our Woosh search results page
        window.location.href = `search.html?q=${encodeURIComponent(query)}`;
      }
    }

    document.getElementById('search-btn').addEventListener('click', () =>
      doSearch(document.getElementById('search-input').value)
    );
    document.getElementById('search-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doSearch(document.getElementById('search-input').value);
    });

    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('search-input').focus(), 100);
    });

    document.querySelectorAll('.quick-btn').forEach(btn => {
      btn.addEventListener('click', () => doSearch(btn.dataset.query));
    });

    document.querySelectorAll('.shortcut').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = link.dataset.url;
      });
    });

    // Logo colour cycle on click
    const logo = document.getElementById('logo');
    const gradients = [
      'linear-gradient(135deg, #8b6cf7 0%, #f06bbd 40%, #5dd8f5 80%)',
      'linear-gradient(135deg, #5dd8f5 0%, #5df5a8 40%, #f5d75d 80%)',
      'linear-gradient(135deg, #f06bbd 0%, #f5935d 40%, #f5d75d 80%)',
    ];
    let gi = 0;
    logo.addEventListener('click', () => {
      gi = (gi + 1) % gradients.length;
      logo.style.background = gradients[gi];
      logo.style.webkitBackgroundClip = 'text';
      logo.style.backgroundClip = 'text';
    });

    // Privacy stats
    if (window.ipc) {
      window.ipc.invoke('get-privacy-stats').then(({ lifetime }) => {
        const total = (lifetime.totalBlocked || 0);
        const el = document.getElementById('privacy-count');
        if (el) el.textContent = total >= 1000 ? (total/1000).toFixed(1) + 'K' : total;
      }).catch(() => {});

      document.getElementById('privacy-link').addEventListener('click', (e) => {
        e.preventDefault();
        window.ipc.send('navigate', 'woosh://privacy');
      });
    }
  </script>
</body>
</html>
