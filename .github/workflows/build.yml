name: Build Woosh

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Woosh-Windows
          path: dist/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Generate .icns icon
        run: |
          mkdir -p assets/icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size assets/icon_512.png --out assets/icon.iconset/icon_${size}x${size}.png
            if [ $size -le 256 ]; then
              double=$((size*2))
              sips -z $double $double assets/icon_512.png --out assets/icon.iconset/icon_${size}x${size}@2x.png
            fi
          done
          iconutil -c icns assets/icon.iconset -o assets/icon.icns

      - name: Build Mac DMG (Intel)
        run: npx electron-builder --mac dmg --x64

      - name: Build Mac DMG (Apple Silicon)
        run: npx electron-builder --mac dmg --arm64

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Woosh-Mac
          path: dist/*.dmg
