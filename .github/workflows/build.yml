name: Build Woosh

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Woosh-Windows
          path: dist/*.exe

  build-mac:
    # macos-14 runs on Apple Silicon (M1) — required for arm64/universal builds
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Generate .icns icon
        run: |
          mkdir -p assets/icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size assets/icon_512.png --out assets/icon.iconset/icon_${size}x${size}.png 2>/dev/null || true
            if [ $size -le 256 ]; then
              double=$((size*2))
              sips -z $double $double assets/icon_512.png --out assets/icon.iconset/icon_${size}x${size}@2x.png 2>/dev/null || true
            fi
          done
          iconutil -c icns assets/icon.iconset -o assets/icon.icns 2>/dev/null || true

      - name: Build Mac DMG (universal — Intel + Apple Silicon)
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable code signing — we're distributing unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Strip quarantine from app inside DMG
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          echo "Processing: $DMG"

          # Mount and capture the mount point properly
          MOUNT_OUTPUT=$(hdiutil attach "$DMG" -nobrowse -noverify -plist)
          MOUNT=$(echo "$MOUNT_OUTPUT" | python3 -c "
import sys, plistlib
data = plistlib.loads(sys.stdin.buffer.read())
for e in data.get('system-entities', []):
    mp = e.get('mount-point')
    if mp:
        print(mp)
        break
")
          echo "Mounted at: $MOUNT"

          # Find the .app
          APP=$(ls "$MOUNT"/*.app 2>/dev/null | head -1)
          echo "App: $APP"

          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in DMG at $MOUNT"
            ls -la "$MOUNT"
            hdiutil detach "$MOUNT" -quiet || true
            exit 1
          fi

          # Copy app out, clean it, repackage
          TMPDIR=$(mktemp -d)
          cp -R "$APP" "$TMPDIR/"
          APPNAME=$(basename "$APP")

          hdiutil detach "$MOUNT" -quiet

          # Strip quarantine from the copy
          xattr -cr "$TMPDIR/$APPNAME"
          chmod -R 755 "$TMPDIR/$APPNAME"

          # Build fresh clean DMG
          OUTDMG="dist/Woosh-universal.dmg"
          hdiutil create -volname "Woosh" \
            -srcfolder "$TMPDIR" \
            -ov -format UDZO \
            "$OUTDMG"

          rm -rf "$TMPDIR"
          echo "Created clean DMG: $OUTDMG"

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Woosh-universal.dmg

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Woosh-Mac-Universal
          path: dist/Woosh-universal.dmg
